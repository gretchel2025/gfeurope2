<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Latest Refactoring Effort: Feature Scaffolding</title>
  <desc id="desc">One-page visual summary of the latest refactor: Tailwind setup, route helpers, route builders, Mongo split, and tests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.45" stop-color="#10294b"/>
      <stop offset="1" stop-color="#0f3d3e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto">
      <path d="M 0 0 L 18 9 L 0 18 z" fill="#f8fafc"/>
    </marker>
    <style>
      .font { font-family: Avenir Next, Montserrat, Trebuchet MS, Arial, sans-serif; }
      .title { font-size: 70px; font-weight: 850; fill: #f8fafc; letter-spacing: -1px; }
      .subtitle { font-size: 30px; fill: #cbd5e1; }
      .small { font-size: 25px; fill: #dbeafe; }
      .tiny { font-size: 21px; fill: #cbd5e1; }
      .label { font-size: 29px; font-weight: 800; fill: #f8fafc; }
      .cardTitle { font-size: 31px; font-weight: 820; fill: #0f172a; }
      .cardText { font-size: 23px; fill: #334155; }
      .mutedText { font-size: 22px; fill: #64748b; }
      .whiteText { font-size: 24px; fill: #f8fafc; }
      .whiteTitle { font-size: 34px; font-weight: 820; fill: #f8fafc; }
      .pillText { font-size: 22px; font-weight: 760; fill: #0f172a; }
      .mono { font-family: SFMono-Regular, Consolas, Menlo, monospace; font-size: 20px; fill: #334155; }
      .panel { fill: rgba(255,255,255,0.92); stroke: rgba(255,255,255,0.58); stroke-width: 2; }
      .darkPanel { fill: rgba(15,23,42,0.76); stroke: rgba(148,163,184,0.35); stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="2200" fill="url(#bg)"/>
  <circle cx="1400" cy="150" r="330" fill="#22d3ee" opacity="0.13"/>
  <circle cx="190" cy="1920" r="430" fill="#facc15" opacity="0.12"/>
  <circle cx="1290" cy="1850" r="360" fill="#34d399" opacity="0.11"/>
  <path d="M95 340 C430 220 655 500 995 360 C1230 265 1410 315 1540 420" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.2"/>

  <g class="font">
    <text x="96" y="132" class="title">Latest Refactor: Feature Scaffolding</text>
    <text x="100" y="182" class="subtitle">Goal: make future Codex feature work faster, safer, and easier to localize.</text>

    <g transform="translate(100 245)">
      <rect width="440" height="146" rx="34" fill="rgba(15,23,42,0.78)" stroke="#60a5fa" stroke-opacity="0.35"/>
      <text x="34" y="54" class="label">Before</text>
      <text x="34" y="92" class="tiny">Feature changes touched too many seams:</text>
      <text x="34" y="123" class="tiny">style config, route glue, URL strings, DB files.</text>
    </g>

    <g transform="translate(580 245)">
      <rect width="440" height="146" rx="34" fill="rgba(15,23,42,0.78)" stroke="#facc15" stroke-opacity="0.42"/>
      <text x="34" y="54" class="label">Refactor Move</text>
      <text x="34" y="92" class="tiny">Create obvious homes for repeated work:</text>
      <text x="34" y="123" class="tiny">helpers, builders, focused modules, tests.</text>
    </g>

    <g transform="translate(1060 245)">
      <rect width="440" height="146" rx="34" fill="rgba(15,23,42,0.78)" stroke="#34d399" stroke-opacity="0.42"/>
      <text x="34" y="54" class="label">After</text>
      <text x="34" y="92" class="tiny">New feature path is clearer:</text>
      <text x="34" y="123" class="tiny">route -> service -> domain -> adapter.</text>
    </g>

    <line x1="544" y1="318" x2="570" y2="318" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)" opacity="0.8"/>
    <line x1="1024" y1="318" x2="1050" y2="318" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)" opacity="0.8"/>

    <text x="100" y="500" class="whiteTitle">What Changed</text>
    <text x="100" y="540" class="small">Four scaffolding improvements now carry more of the repetitive work.</text>

    <g transform="translate(100 600)" filter="url(#shadow)">
      <rect class="panel" width="675" height="290" rx="34"/>
      <rect x="32" y="32" width="86" height="86" rx="24" fill="url(#blue)"/>
      <text x="56" y="88" font-size="46" fill="#fff" font-family="Arial" font-weight="800">1</text>
      <text x="142" y="64" class="cardTitle">Tailwind Build Setup</text>
      <text x="142" y="103" class="cardText">Moved PostCSS and Tailwind config to repo root.</text>
      <text x="142" y="137" class="cardText">Added Tailwind v4 PostCSS bridge.</text>
      <text x="142" y="171" class="cardText">Kept CDN fallback for local stability.</text>
      <rect x="142" y="207" width="455" height="44" rx="22" fill="#dbeafe"/>
      <text x="164" y="236" class="pillText">Less mystery when UI utilities change</text>
    </g>

    <g transform="translate(825 600)" filter="url(#shadow)">
      <rect class="panel" width="675" height="290" rx="34"/>
      <rect x="32" y="32" width="86" height="86" rx="24" fill="url(#gold)"/>
      <text x="56" y="88" font-size="46" fill="#fff" font-family="Arial" font-weight="800">2</text>
      <text x="142" y="64" class="cardTitle">Route Handler Helpers</text>
      <text x="142" y="103" class="cardText">Added shared wrappers for route errors and auth.</text>
      <text x="142" y="137" class="cardText">Admin and superuser actions now follow one shape.</text>
      <text x="142" y="171" class="cardText">Required route params fail intentionally.</text>
      <rect x="142" y="207" width="455" height="44" rx="22" fill="#fef3c7"/>
      <text x="164" y="236" class="pillText">Less copy-paste in +page.server.ts</text>
    </g>

    <g transform="translate(100 930)" filter="url(#shadow)">
      <rect class="panel" width="675" height="290" rx="34"/>
      <rect x="32" y="32" width="86" height="86" rx="24" fill="url(#green)"/>
      <text x="56" y="88" font-size="46" fill="#fff" font-family="Arial" font-weight="800">3</text>
      <text x="142" y="64" class="cardTitle">Mongo Repository Split</text>
      <text x="142" y="103" class="cardText">Separated models, mappers, and repositories.</text>
      <text x="142" y="137" class="cardText">Each persistence concern has a focused file.</text>
      <text x="142" y="171" class="cardText">The old import path remains as a barrel.</text>
      <rect x="142" y="207" width="455" height="44" rx="22" fill="#d1fae5"/>
      <text x="164" y="236" class="pillText">Less scrolling through one giant DB file</text>
    </g>

    <g transform="translate(825 930)" filter="url(#shadow)">
      <rect class="panel" width="675" height="290" rx="34"/>
      <rect x="32" y="32" width="86" height="86" rx="24" fill="#a78bfa"/>
      <text x="56" y="88" font-size="46" fill="#fff" font-family="Arial" font-weight="800">4</text>
      <text x="142" y="64" class="cardTitle">Routes and Tests</text>
      <text x="142" y="103" class="cardText">Added admin route builders for links and redirects.</text>
      <text x="142" y="137" class="cardText">Added Vitest domain tests for booking and ticket rules.</text>
      <text x="142" y="171" class="cardText">Feature work now has a small safety net.</text>
      <rect x="142" y="207" width="455" height="44" rx="22" fill="#ede9fe"/>
      <text x="164" y="236" class="pillText">Less broken navigation and safer rule edits</text>
    </g>

    <text x="100" y="1335" class="whiteTitle">New Feature Path</text>
    <text x="100" y="1374" class="small">When Codex implements a feature, it now has obvious places to make each kind of change.</text>

    <g transform="translate(100 1440)" filter="url(#shadow)">
      <rect class="darkPanel" width="1400" height="365" rx="42"/>

      <g transform="translate(48 55)">
        <rect width="235" height="122" rx="28" fill="#eff6ff"/>
        <text x="28" y="48" class="cardTitle">UI Route</text>
        <text x="28" y="84" class="mono">+page.svelte</text>
      </g>

      <g transform="translate(328 55)">
        <rect width="250" height="122" rx="28" fill="#fef3c7"/>
        <text x="28" y="48" class="cardTitle">Server Glue</text>
        <text x="28" y="84" class="mono">handlers.ts</text>
      </g>

      <g transform="translate(623 55)">
        <rect width="250" height="122" rx="28" fill="#dcfce7"/>
        <text x="28" y="48" class="cardTitle">Use Case</text>
        <text x="28" y="84" class="mono">services/*</text>
      </g>

      <g transform="translate(918 55)">
        <rect width="250" height="122" rx="28" fill="#ede9fe"/>
        <text x="28" y="48" class="cardTitle">Rules</text>
        <text x="28" y="84" class="mono">domain/*</text>
      </g>

      <g transform="translate(1213 55)">
        <rect width="140" height="122" rx="28" fill="#fee2e2"/>
        <text x="28" y="48" class="cardTitle">DB</text>
        <text x="28" y="84" class="mono">mongo/*</text>
      </g>

      <line x1="283" y1="116" x2="315" y2="116" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="578" y1="116" x2="610" y2="116" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="873" y1="116" x2="905" y2="116" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)"/>
      <line x1="1168" y1="116" x2="1200" y2="116" stroke="#f8fafc" stroke-width="5" marker-end="url(#arrow)"/>

      <text x="52" y="244" class="whiteText">Supporting scaffolds:</text>
      <g transform="translate(52 276)">
        <text x="0" y="0" class="tiny">adminRoutes.ts</text>
        <text x="0" y="32" class="tiny">names links and redirects</text>
      </g>
      <g transform="translate(500 276)">
        <text x="0" y="0" class="tiny">mappers.ts</text>
        <text x="0" y="32" class="tiny">protects domain shapes</text>
      </g>
      <g transform="translate(910 276)">
        <text x="0" y="0" class="tiny">*.test.ts</text>
        <text x="0" y="32" class="tiny">guards business rules</text>
      </g>
    </g>

    <text x="100" y="1912" class="whiteTitle">Why This Helps Codex</text>

    <g transform="translate(100 1965)">
      <rect x="0" y="0" width="420" height="92" rx="28" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)"/>
      <text x="28" y="38" class="whiteText">Smaller edit targets</text>
      <text x="28" y="69" class="tiny">Less accidental cross-layer churn</text>
    </g>
    <g transform="translate(590 1965)">
      <rect x="0" y="0" width="420" height="92" rx="28" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)"/>
      <text x="28" y="38" class="whiteText">Reusable route patterns</text>
      <text x="28" y="69" class="tiny">Less duplicated auth/error glue</text>
    </g>
    <g transform="translate(1080 1965)">
      <rect x="0" y="0" width="420" height="92" rx="28" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.25)"/>
      <text x="28" y="38" class="whiteText">Tests for rule changes</text>
      <text x="28" y="69" class="tiny">Faster confidence before commit</text>
    </g>

  </g>
</svg>
