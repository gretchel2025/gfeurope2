<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <style>
      .bg { fill: #f8f2e8; }
      .grain { opacity: 0.14; }
      .title { font: 800 54px Arial, Helvetica, sans-serif; fill: #071f49; }
      .subtitle { font: italic 23px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .section { font: 800 31px Arial, Helvetica, sans-serif; fill: #063f4c; }
      .card-title { font: 800 23px Arial, Helvetica, sans-serif; fill: #071f49; }
      .small-title { font: 800 20px Arial, Helvetica, sans-serif; fill: #071f49; }
      .path { font: 700 14px Menlo, Consolas, monospace; fill: white; }
      .mono { font: 700 13px Menlo, Consolas, monospace; fill: #071f49; }
      .body { font: 16px Arial, Helvetica, sans-serif; fill: #111827; }
      .body-small { font: 14px Arial, Helvetica, sans-serif; fill: #111827; }
      .micro { font: 12px Arial, Helvetica, sans-serif; fill: #374151; }
      .panel { fill: rgba(255,255,255,0.52); stroke: #c7bfae; stroke-width: 1.2; }
      .teal { stroke: #05858d; }
      .blue { stroke: #1f5fa8; }
      .green { stroke: #4f8a3a; }
      .gold { stroke: #c97b00; }
      .red { stroke: #ef4b36; }
      .purple { stroke: #7057b8; }
      .teal-fill { fill: #05858d; }
      .blue-fill { fill: #1f5fa8; }
      .green-fill { fill: #4f8a3a; }
      .gold-fill { fill: #c97b00; }
      .red-fill { fill: #ef4b36; }
      .purple-fill { fill: #7057b8; }
      .soft-teal { fill: #e4f5f2; }
      .soft-blue { fill: #e9f2fb; }
      .soft-green { fill: #edf7e8; }
      .soft-gold { fill: #fff3d8; }
      .soft-red { fill: #fff0ec; }
      .soft-purple { fill: #f1edff; }
      .arrow { stroke: #071f49; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .thin-arrow { stroke: #071f49; stroke-width: 2.2; fill: none; marker-end: url(#arrowhead); }
      .dash { stroke-dasharray: 7 6; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#071f49"/>
    </marker>
    <pattern id="speckle" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#bda674"/>
      <circle cx="16" cy="12" r="0.8" fill="#d3bc83"/>
      <circle cx="10" cy="20" r="0.7" fill="#a98548"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7c6d58" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect class="bg" width="1536" height="1024"/>
  <rect class="grain" width="1536" height="1024" fill="url(#speckle)"/>

  <text x="768" y="68" text-anchor="middle" class="title">Grand Feast Booking Flow</text>
  <line x1="250" y1="104" x2="320" y2="104" stroke="#e88920" stroke-width="3"/>
  <text x="768" y="112" text-anchor="middle" class="subtitle">From public reservation to payment, ticket generation, email, and check-in</text>
  <line x1="1216" y1="104" x2="1286" y2="104" stroke="#e88920" stroke-width="3"/>

  <rect x="24" y="138" width="1488" height="282" rx="8" class="panel"/>
  <line x1="38" y1="154" x2="498" y2="154" stroke="#c7bfae"/>
  <line x1="1038" y1="154" x2="1498" y2="154" stroke="#c7bfae"/>
  <text x="768" y="161" text-anchor="middle" class="section">Main happy path</text>

  <g filter="url(#shadow)">
    <rect x="40" y="188" width="190" height="186" rx="10" fill="#fffdf8" class="teal" stroke-width="1.6"/>
    <circle cx="64" cy="212" r="16" class="teal-fill"/>
    <text x="64" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">1</text>
    <path d="M98 221 h58 v42 h-58 z M108 211 h24 l8 11 h16" fill="none" stroke="#05858d" stroke-width="5"/>
    <rect x="56" y="250" width="158" height="28" rx="4" fill="#fffdf8"/>
    <text x="135" y="272" text-anchor="middle" class="card-title">Open Booking</text>
    <rect x="54" y="286" width="162" height="24" rx="5" class="teal-fill"/>
    <text x="135" y="303" text-anchor="middle" class="path">/events/gfeu2026/newbooking</text>
    <text x="135" y="330" text-anchor="middle" class="body">load ticket counters</text>
    <text x="135" y="352" text-anchor="middle" class="body">redirect if sold out</text>

    <rect x="282" y="188" width="190" height="186" rx="10" fill="#fffdf8" class="blue" stroke-width="1.6"/>
    <circle cx="306" cy="212" r="16" class="blue-fill"/>
    <text x="306" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">2</text>
    <path d="M342 213 h62 v70 h-62 z M354 234 h38 M354 254 h38 M354 274 h24" fill="none" stroke="#1f5fa8" stroke-width="5" stroke-linecap="round"/>
    <rect x="298" y="250" width="158" height="28" rx="4" fill="#fffdf8"/>
    <text x="377" y="272" text-anchor="middle" class="card-title">Submit Form</text>
    <rect x="296" y="286" width="162" height="24" rx="5" class="blue-fill"/>
    <text x="377" y="303" text-anchor="middle" class="path">parseCreateBooking</text>
    <text x="377" y="330" text-anchor="middle" class="body">name, email, city,</text>
    <text x="377" y="352" text-anchor="middle" class="body">type, quantity, guests</text>

    <rect x="524" y="188" width="190" height="186" rx="10" fill="#fffdf8" class="green" stroke-width="1.6"/>
    <circle cx="548" cy="212" r="16" class="green-fill"/>
    <text x="548" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">3</text>
    <path d="M584 206 h42 v42 h-42 z M596 248 v34 M574 282 h64" fill="none" stroke="#4f8a3a" stroke-width="5" stroke-linecap="round"/>
    <rect x="532" y="250" width="174" height="28" rx="4" fill="#fffdf8"/>
    <text x="619" y="272" text-anchor="middle" class="card-title">Create Booking</text>
    <rect x="538" y="286" width="162" height="24" rx="5" class="green-fill"/>
    <text x="619" y="303" text-anchor="middle" class="path">BookingService</text>
    <text x="619" y="330" text-anchor="middle" class="body">validate rules, total,</text>
    <text x="619" y="352" text-anchor="middle" class="body">generate reference no.</text>

    <rect x="766" y="188" width="190" height="186" rx="10" fill="#fffdf8" class="gold" stroke-width="1.6"/>
    <circle cx="790" cy="212" r="16" class="gold-fill"/>
    <text x="790" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">4</text>
    <ellipse cx="861" cy="220" rx="31" ry="12" fill="none" stroke="#c97b00" stroke-width="5"/>
    <path d="M830 220 v52 c0 7 14 12 31 12 s31 -5 31 -12 v-52 M830 238 c0 7 14 12 31 12 s31 -5 31 -12 M830 256 c0 7 14 12 31 12 s31 -5 31 -12" fill="none" stroke="#c97b00" stroke-width="4"/>
    <rect x="774" y="250" width="174" height="28" rx="4" fill="#fffdf8"/>
    <text x="861" y="272" text-anchor="middle" class="card-title">Reserve Inventory</text>
    <rect x="780" y="286" width="162" height="24" rx="5" class="gold-fill"/>
    <text x="861" y="303" text-anchor="middle" class="path">create_booking_rpc</text>
    <text x="861" y="330" text-anchor="middle" class="body">insert booking and</text>
    <text x="861" y="352" text-anchor="middle" class="body">move available -> reserved</text>

    <rect x="1008" y="188" width="190" height="186" rx="10" fill="#fffdf8" class="red" stroke-width="1.6"/>
    <circle cx="1032" cy="212" r="16" class="red-fill"/>
    <text x="1032" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">5</text>
    <path d="M1060 222 h76 v52 h-76 z M1060 222 l38 31 l38 -31" fill="none" stroke="#ef4b36" stroke-width="5" stroke-linejoin="round"/>
    <rect x="1016" y="250" width="174" height="28" rx="4" fill="#fffdf8"/>
    <text x="1103" y="272" text-anchor="middle" class="card-title">Confirm By Email</text>
    <rect x="1022" y="286" width="162" height="24" rx="5" class="red-fill"/>
    <text x="1103" y="303" text-anchor="middle" class="path">NotificationService</text>
    <text x="1103" y="330" text-anchor="middle" class="body">Resend message with</text>
    <text x="1103" y="352" text-anchor="middle" class="body">PayPal link + ref no.</text>

    <rect x="1250" y="188" width="224" height="186" rx="10" fill="#fffdf8" class="purple" stroke-width="1.6"/>
    <circle cx="1274" cy="212" r="16" class="purple-fill"/>
    <text x="1274" y="220" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">6</text>
    <path d="M1320 218 h74 v62 h-74 z M1332 236 h50 M1332 254 h50 M1332 272 h28" fill="none" stroke="#7057b8" stroke-width="5" stroke-linecap="round"/>
    <rect x="1276" y="250" width="172" height="28" rx="4" fill="#fffdf8"/>
    <text x="1362" y="272" text-anchor="middle" class="card-title">Success Page</text>
    <rect x="1266" y="286" width="192" height="24" rx="5" class="purple-fill"/>
    <text x="1362" y="303" text-anchor="middle" class="path">/events/gfeu2026/newbooking/success</text>
    <text x="1362" y="330" text-anchor="middle" class="body">booking state is</text>
    <text x="1362" y="352" text-anchor="middle" class="body">UNPAID + reserved</text>
  </g>

  <path d="M230 280 H274" class="arrow"/>
  <path d="M472 280 H516" class="arrow"/>
  <path d="M714 280 H758" class="arrow"/>
  <path d="M956 280 H1000" class="arrow"/>
  <path d="M1198 280 H1242" class="arrow"/>

  <rect x="24" y="448" width="1488" height="284" rx="8" class="panel"/>
  <line x1="38" y1="464" x2="440" y2="464" stroke="#c7bfae"/>
  <line x1="1096" y1="464" x2="1498" y2="464" stroke="#c7bfae"/>
  <text x="768" y="471" text-anchor="middle" class="section">Admin lifecycle branches</text>

  <g filter="url(#shadow)">
    <rect x="48" y="504" width="248" height="162" rx="10" fill="#fffdf8" class="green" stroke-width="1.5"/>
    <circle cx="86" cy="548" r="28" class="soft-green"/>
    <path d="M86 522 l29 11 v22 c0 20 -12 34 -29 44 c-17 -10 -29 -24 -29 -44 v-22 z" fill="none" stroke="#4f8a3a" stroke-width="4"/>
    <text x="130" y="538" class="card-title">Mark Paid</text>
    <rect x="130" y="552" width="122" height="24" rx="5" class="green-fill"/>
    <text x="191" y="569" text-anchor="middle" class="path">markPaid()</text>
    <text x="68" y="606" class="body">• adminAction guard</text>
    <text x="68" y="632" class="body">• only UNPAID can change</text>
    <text x="68" y="658" class="body">• reserved -> sold via RPC</text>

    <rect x="342" y="504" width="268" height="162" rx="10" fill="#fffdf8" class="gold" stroke-width="1.5"/>
    <circle cx="380" cy="548" r="28" class="soft-gold"/>
    <path d="M362 526 h36 v46 h-36 z M370 536 h20 M370 548 h20 M370 560 h13" fill="none" stroke="#c97b00" stroke-width="4" stroke-linecap="round"/>
    <text x="424" y="538" class="card-title">Generate Tickets</text>
    <rect x="424" y="552" width="172" height="24" rx="5" class="gold-fill"/>
    <text x="510" y="569" text-anchor="middle" class="path">generateRelatedTickets</text>
    <text x="362" y="606" class="body">• only PAID bookings</text>
    <text x="362" y="632" class="body">• skip already generated guests</text>
    <text x="362" y="658" class="body">• append ticket ids to booking</text>

    <rect x="656" y="504" width="268" height="162" rx="10" fill="#fffdf8" class="blue" stroke-width="1.5"/>
    <circle cx="694" cy="548" r="28" class="soft-blue"/>
    <path d="M676 527 h36 v36 h-36 z M694 563 v24 M678 587 h32" fill="none" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round"/>
    <text x="738" y="538" class="card-title">Create Ticket Assets</text>
    <rect x="738" y="552" width="150" height="24" rx="5" class="blue-fill"/>
    <text x="813" y="569" text-anchor="middle" class="path">TicketService</text>
    <text x="676" y="606" class="body">• ticket id Txxx-xxxx</text>
    <text x="676" y="632" class="body">• check-in URL QR payload</text>
    <text x="676" y="658" class="body">• upload QR image to Cloudinary</text>

    <rect x="970" y="504" width="236" height="162" rx="10" fill="#fffdf8" class="red" stroke-width="1.5"/>
    <circle cx="1008" cy="548" r="28" class="soft-red"/>
    <path d="M987 540 h42 v34 h-42 z M987 540 l21 17 l21 -17" fill="none" stroke="#ef4b36" stroke-width="4" stroke-linejoin="round"/>
    <text x="1052" y="538" class="card-title">Send Ticket Email</text>
    <rect x="1052" y="552" width="122" height="24" rx="5" class="red-fill"/>
    <text x="1113" y="569" text-anchor="middle" class="path">sendTickets</text>
    <text x="990" y="606" class="body">• load booking + tickets</text>
    <text x="990" y="632" class="body">• include QR image URLs</text>
    <text x="990" y="658" class="body">• redirect to email success</text>

    <rect x="1252" y="504" width="220" height="162" rx="10" fill="#fffdf8" class="purple" stroke-width="1.5"/>
    <circle cx="1290" cy="548" r="28" class="soft-purple"/>
    <path d="M1272 528 h38 v38 h-38 z M1280 536 h22 M1280 548 h22 M1280 560 h12" fill="none" stroke="#7057b8" stroke-width="4" stroke-linecap="round"/>
    <rect x="1318" y="516" width="132" height="28" rx="4" fill="#fffdf8"/>
    <text x="1334" y="538" class="card-title">Summary + QR</text>
    <rect x="1334" y="552" width="112" height="24" rx="5" class="purple-fill"/>
    <text x="1390" y="569" text-anchor="middle" class="path">summary</text>
    <text x="1272" y="606" class="body">• booking summary page</text>
    <text x="1272" y="632" class="body">• QR target is check-in URL</text>
    <text x="1272" y="658" class="body">• updates ticket status</text>
  </g>

  <path d="M296 584 H334" class="arrow"/>
  <path d="M610 584 H648" class="arrow"/>
  <path d="M924 584 H962" class="arrow"/>
  <path d="M1206 584 H1244" class="arrow"/>

  <g>
    <path d="M172 504 C172 456 290 456 402 504" class="thin-arrow dash"/>
    <text x="288" y="468" text-anchor="middle" class="body-small">paid branch continues only after operator confirms payment</text>
  </g>

  <rect x="70" y="690" width="330" height="24" rx="6" fill="#fffdf8" stroke="#c7bfae" stroke-dasharray="5 5"/>
  <text x="235" y="707" text-anchor="middle" class="body-small">Reminder: admin can email unpaid bookings.</text>
  <rect x="436" y="690" width="356" height="24" rx="6" fill="#fffdf8" stroke="#c7bfae" stroke-dasharray="5 5"/>
  <text x="614" y="707" text-anchor="middle" class="body-small">Cancel: unpaid returns reserved inventory to available.</text>

  <rect x="24" y="760" width="710" height="214" rx="8" class="panel"/>
  <line x1="38" y1="776" x2="218" y2="776" stroke="#c7bfae"/>
  <line x1="540" y1="776" x2="720" y2="776" stroke="#c7bfae"/>
  <text x="379" y="783" text-anchor="middle" class="section">State transitions</text>

  <g filter="url(#shadow)">
    <rect x="56" y="828" width="150" height="64" rx="10" fill="#fffdf8" class="gold" stroke-width="1.4"/>
    <text x="131" y="855" text-anchor="middle" class="card-title">UNPAID</text>
    <text x="131" y="878" text-anchor="middle" class="body-small">reserved inventory</text>
    <rect x="302" y="828" width="150" height="64" rx="10" fill="#fffdf8" class="green" stroke-width="1.4"/>
    <text x="377" y="855" text-anchor="middle" class="card-title">PAID</text>
    <text x="377" y="878" text-anchor="middle" class="body-small">sold inventory</text>
    <rect x="548" y="828" width="150" height="64" rx="10" fill="#fffdf8" class="blue" stroke-width="1.4"/>
    <text x="623" y="855" text-anchor="middle" class="card-title">TICKETS</text>
    <text x="623" y="878" text-anchor="middle" class="body-small">ids + QR images</text>
  </g>
  <path d="M206 860 H294" class="arrow"/>
  <text x="250" y="844" text-anchor="middle" class="micro">mark paid</text>
  <path d="M452 860 H540" class="arrow"/>
  <text x="496" y="844" text-anchor="middle" class="micro">generate</text>
  <path d="M131 892 C120 940 224 940 246 894" class="thin-arrow dash" stroke="#ef4b36"/>
  <text x="186" y="938" text-anchor="middle" class="body-small">cancel only if UNPAID</text>
  <text x="442" y="932" text-anchor="middle" class="body-small">Domain checks live in src/lib/domain/booking.ts.</text>

  <rect x="770" y="760" width="742" height="214" rx="8" class="panel"/>
  <line x1="784" y1="776" x2="978" y2="776" stroke="#c7bfae"/>
  <line x1="1304" y1="776" x2="1498" y2="776" stroke="#c7bfae"/>
  <text x="1141" y="783" text-anchor="middle" class="section">Code ownership</text>
  <g filter="url(#shadow)">
    <rect x="806" y="818" width="202" height="118" rx="10" fill="#fffdf8" class="teal" stroke-width="1.2"/>
    <text x="826" y="848" class="small-title" fill="#05858d">HTTP edge</text>
    <text x="826" y="876" class="body-small">• +page.server.ts actions</text>
    <text x="826" y="899" class="body-small">• parse forms and redirect</text>
    <text x="826" y="922" class="body-small">• adminAction guards</text>

    <rect x="1030" y="818" width="222" height="118" rx="10" fill="#fffdf8" class="green" stroke-width="1.2"/>
    <text x="1050" y="848" class="small-title" fill="#4f8a3a">Use-case layer</text>
    <text x="1050" y="876" class="body-small">• BookingService owns lifecycle</text>
    <text x="1050" y="899" class="body-small">• TicketService owns tickets</text>
    <text x="1050" y="922" class="body-small">• NotificationService owns email</text>

    <rect x="1274" y="818" width="202" height="118" rx="10" fill="#fffdf8" class="gold" stroke-width="1.2"/>
    <text x="1294" y="848" class="small-title" fill="#c97b00">Infrastructure</text>
    <text x="1294" y="876" class="body-small">• Supabase repositories/RPC</text>
    <text x="1294" y="899" class="body-small">• Resend delivery</text>
    <text x="1294" y="922" class="body-small">• Cloudinary QR storage</text>
  </g>

  <text x="768" y="1000" text-anchor="middle" class="micro">Source paths: /events/gfeu2026/newbooking, admin booking details/cancel/summary routes, BookingService, TicketService, NotificationService, Supabase repositories.</text>
</svg>
