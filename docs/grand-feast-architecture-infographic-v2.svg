      .soft-blue { fill: #e9f2fb; }
      .soft-green { fill: #edf7e8; }
      .soft-gold { fill: #fff3d8; }
      .soft-red { fill: #fff0ec; }
      .arrow { stroke: #071f49; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
