  <text x="676" y="430" text-anchor="middle" class="section">What belongs where now?</text>

  <g filter="url(#shadow)">
    <rect x="38" y="452" width="206" height="220" rx="10" fill="#fffdf8" class="teal" stroke-width="1.4"/>
