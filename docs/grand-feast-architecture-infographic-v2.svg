  <rect class="bg" width="1536" height="1024"/>
  <rect class="grain" width="1536" height="1024" fill="url(#speckle)"/>

  <text x="768" y="70" text-anchor="middle" class="title">Grand Feast App Architecture: Current Codebase Map</text>
  <line x1="300" y1="104" x2="360" y2="104" stroke="#e88920" stroke-width="3"/>
  <text x="768" y="112" text-anchor="middle" class="subtitle">A practical guide for placing features, services, providers, and auth logic</text>
  <line x1="1176" y1="104" x2="1238" y2="104" stroke="#e88920" stroke-width="3"/>

  <rect x="24" y="138" width="1488" height="246" rx="8" class="panel"/>
  <line x1="38" y1="152" x2="520" y2="152" stroke="#c7bfae"/>
  <line x1="1016" y1="152" x2="1498" y2="152" stroke="#c7bfae"/>
  <text x="768" y="158" text-anchor="middle" class="section">How feature code flows through the app</text>

