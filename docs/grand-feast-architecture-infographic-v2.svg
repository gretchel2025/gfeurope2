    <text x="1171" y="344" text-anchor="middle" class="body">media, logging, config</text>

    <rect x="1328" y="174" width="168" height="184" rx="10" fill="#fffdf8" class="red" stroke-width="1.6"/>
    <circle cx="1352" cy="198" r="16" class="red-fill"/>
    <text x="1352" y="206" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">6</text>
    <path d="M1392 236 h82 c15 0 25 -10 25 -23 c0 -13 -10 -23 -23 -23 c-4 0 -7 1 -10 2 c-5 -15 -18 -26 -35 -26 c-20 0 -36 16 -36 36 c-11 1 -20 10 -20 21 c0 8 7 13 17 13 z" fill="none" stroke="#ef4b36" stroke-width="4"/>
