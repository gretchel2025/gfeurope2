    <text x="913" y="344" text-anchor="middle" class="body">state transitions</text>

    <rect x="1070" y="174" width="202" height="184" rx="10" fill="#fffdf8" class="gold" stroke-width="1.6"/>
    <circle cx="1094" cy="198" r="16" class="gold-fill"/>
    <text x="1094" y="206" text-anchor="middle" font-family="Arial" font-size="20" font-weight="800" fill="white">5</text>
    <ellipse cx="1170" cy="204" rx="30" ry="12" fill="none" stroke="#c97b00" stroke-width="4"/>
    <path d="M1140 204 v54 c0 7 14 12 30 12 s30 -5 30 -12 v-54 M1140 222 c0 7 14 12 30 12 s30 -5 30 -12 M1140 240 c0 7 14 12 30 12 s30 -5 30 -12" fill="none" stroke="#c97b00" stroke-width="4"/>
