    <text x="655" y="293" text-anchor="middle" class="path">src/lib/application</text>
    <text x="655" y="322" text-anchor="middle" class="body">booking, tickets, counters,</text>
    <text x="655" y="344" text-anchor="middle" class="body">notifications, reports</text>

    <rect x="812" y="174" width="202" height="184" rx="10" fill="#fffdf8" class="green" stroke-width="1.6"/>
