  </g>

  <rect x="24" y="810" width="1488" height="176" rx="8" class="panel"/>
  <line x1="38" y1="826" x2="532" y2="826" stroke="#c7bfae"/>
  <line x1="1004" y1="826" x2="1498" y2="826" stroke="#c7bfae"/>
  <text x="768" y="834" text-anchor="middle" class="section">Current cross-cutting flows</text>

  <g filter="url(#shadow)">
    <rect x="38" y="864" width="346" height="92" rx="10" fill="#fffdf8" class="teal" stroke-width="1.1"/>
