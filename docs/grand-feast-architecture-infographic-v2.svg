  <rect x="1240" y="406" width="272" height="54" rx="8" fill="#fb5d3d"/>
  <text x="1376" y="441" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="white">Quick rule of thumb</text>
