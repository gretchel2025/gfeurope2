    <text x="112" y="491" class="small-title" fill="#05858d">src/routes</text>
    <text x="58" y="548" class="body">• entry points for users</text>
    <text x="58" y="573" class="body">• Svelte pages and forms</text>
    <text x="58" y="598" class="body">• load/actions/redirects</text>
    <text x="58" y="623" class="body">• auth callback route</text>
    <text x="58" y="648" class="body">• stay thin</text>

    <rect x="266" y="452" width="206" height="220" rx="10" fill="#fffdf8" class="blue" stroke-width="1.4"/>
    <circle cx="300" cy="490" r="28" class="soft-blue"/>
    <path d="M291 476 l-14 14 l14 14 M309 476 l14 14 l-14 14 M297 510 l10 -40" fill="none" stroke="#1f5fa8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="491" class="small-title" fill="#1f5fa8">server/http</text>
    <text x="286" y="548" class="body">• service composition</text>
    <text x="286" y="573" class="body">• form parsing</text>
    <text x="286" y="598" class="body">• admin/superuser guards</text>
    <text x="286" y="623" class="body">• app-error to HTTP</text>
    <text x="286" y="648" class="body">• reusable route wrappers</text>

    <rect x="494" y="452" width="214" height="220" rx="10" fill="#fffdf8" class="teal" stroke-width="1.4"/>
    <circle cx="528" cy="490" r="28" class="soft-teal"/>
    <path d="M520 474 h24 v17 h17 v24 h-17 v17 h-24 v-17 h-17 v-24 h17 z" fill="#05858d"/>
    <text x="568" y="491" class="small-title" fill="#05858d">application</text>
    <text x="514" y="548" class="body">• orchestrates use cases</text>
    <text x="514" y="573" class="body">• BookingService</text>
    <text x="514" y="598" class="body">• TicketService</text>
    <text x="514" y="623" class="body">• NotificationService</text>
    <text x="514" y="648" class="body">• counters, reports, system</text>

    <rect x="730" y="452" width="214" height="220" rx="10" fill="#fffdf8" class="green" stroke-width="1.4"/>
    <circle cx="764" cy="490" r="28" class="soft-green"/>
    <path d="M764 465 l28 11 v23 c0 20 -12 34 -28 43 c-16 -9 -28 -23 -28 -43 v-23 z" fill="none" stroke="#4f8a3a" stroke-width="4"/>
    <path d="M752 496 l9 9 l18 -25" fill="none" stroke="#4f8a3a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="804" y="491" class="small-title" fill="#4f8a3a">domain + ports</text>
    <text x="750" y="548" class="body">• Booking, Ticket, User</text>
    <text x="750" y="573" class="body">• enums and state rules</text>
    <text x="750" y="598" class="body">• repository contracts</text>
    <text x="750" y="623" class="body">• provider contracts</text>
    <text x="750" y="648" class="body">• no vendor imports</text>

    <rect x="966" y="452" width="224" height="220" rx="10" fill="#fffdf8" class="gold" stroke-width="1.4"/>
    <circle cx="1000" cy="490" r="28" class="soft-gold"/>
    <ellipse cx="1000" cy="474" rx="22" ry="9" fill="none" stroke="#c97b00" stroke-width="4"/>
    <path d="M978 474 v40 c0 6 10 10 22 10 s22 -4 22 -10 v-40 M978 487 c0 6 10 10 22 10 s22 -4 22 -10 M978 500 c0 6 10 10 22 10 s22 -4 22 -10" fill="none" stroke="#c97b00" stroke-width="4"/>
    <text x="1042" y="491" class="small-title" fill="#c97b00">infrastructure</text>
    <text x="986" y="548" class="body">• Supabase repos/RPC</text>
    <text x="986" y="573" class="body">• Supabase SSR auth</text>
    <text x="986" y="598" class="body">• Resend email sender</text>
    <text x="986" y="623" class="body">• Cloudinary QR storage</text>
    <text x="986" y="648" class="body">• env, logging, bootstrap</text>
  </g>

  <path d="M141 704 V690 H602 V672" class="arrow"/>
  <text x="328" y="726" text-anchor="middle" class="label">routes call HTTP helpers and composed services</text>
  <path d="M601 690 V674" class="arrow"/>
  <path d="M601 690 H836 V674" class="arrow dash"/>
  <text x="718" y="714" text-anchor="middle" class="label">services depend on domain rules</text>
  <path d="M836 690 H1078 V674" class="arrow dash" stroke="#c97b00"/>
  <text x="958" y="714" text-anchor="middle" class="label">infrastructure implements ports</text>
  <rect x="376" y="738" width="506" height="28" rx="6" fill="#fffdf8" stroke="#c7bfae" stroke-dasharray="5 5"/>
  <text x="629" y="758" text-anchor="middle" class="body-small">Application owns workflow. Domain owns rules. Infrastructure owns outside-world details.</text>

