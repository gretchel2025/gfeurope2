    <text x="492" y="944" class="body-small">session -> app_metadata roles + event_roles</text>

    <rect x="770" y="864" width="346" height="92" rx="10" fill="#fffdf8" class="gold" stroke-width="1.1"/>
    <circle cx="812" cy="910" r="28" class="soft-gold"/>
